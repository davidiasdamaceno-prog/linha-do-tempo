<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Linha do Tempo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fafaf8;font-family:'DM Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .3s,color .3s}
body.dark{background:#181814;color:#e8e4df}
#bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #e8e4df;flex-shrink:0;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:background .3s,border-color .3s}
body.dark #bar{background:#23231f;border-color:#38352e}
.ti{font-family:'DM Serif Display',serif;font-size:15px}
.ri{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
button{padding:5px 11px;border-radius:20px;border:1px solid #ddd;cursor:pointer;background:#fff;color:#555;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;transition:background .2s,border-color .2s,color .2s}
body.dark button{background:#2a2a25;border-color:#444;color:#ccc}
.bg{color:#166534;border-color:#bbf7d0;background:#f0fdf4}
body.dark .bg{color:#4ade80;border-color:#166534;background:#052e16}
.bo{color:#9a3412;border-color:#fed7aa;background:#fff7ed}
body.dark .bo{color:#fb923c;border-color:#7c2d12;background:#1c0a00}
.bb{color:#1e3a5f;border-color:#bfdbfe;background:#eff6ff}
body.dark .bb{color:#60a5fa;border-color:#1e3a5f;background:#0c1a2e}

#hint{padding:3px 16px;font-size:10px;color:#b0a898;flex-shrink:0;border-bottom:1px solid #f0ece6;transition:background .3s}
body.dark #hint{color:#6b6456;border-color:#2a2720}
#wrap{flex:1;overflow:scroll;position:relative}
svg{display:block}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.0);z-index:60;align-items:center;justify-content:center}
#ov.on{display:flex}
#md{background:#fff;border-radius:14px;padding:14px 16px;width:300px;max-height:86vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18)}
body.dark #md{background:#23231f;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.mh{font-family:'DM Serif Display',serif;font-size:15px;margin-bottom:8px}
.fi{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.fi label{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
body.dark .fi label{color:#666}
.fi input,.fi select,.fi textarea{font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid #ddd;background:#fafaf8;color:#111;outline:none;width:100%;font-family:'DM Sans',sans-serif}
body.dark .fi input,body.dark .fi select,body.dark .fi textarea{background:#1a1a16;border-color:#3a3730;color:#e0dbd5}
.fi textarea{resize:vertical;min-height:60px;line-height:1.4}
.r2{display:flex;gap:8px}.r2 .fi{flex:1}
.mb{display:flex;gap:7px;justify-content:flex-end;margin-top:8px}

#searchpanel{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e0dbd5;border-radius:12px;padding:12px 16px;box-shadow:0 4px 24px rgba(0,0,0,.12);z-index:45;display:none;align-items:center;gap:8px;min-width:280px}
body.dark #searchpanel{background:#23231f;border-color:#3a3730}
#searchpanel.on{display:flex}
#searchinput{flex:1;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #ddd;outline:none;font-family:'DM Sans',sans-serif}
body.dark #searchinput{background:#1a1a16;border-color:#3a3730;color:#e0dbd5}


/* Sidebar */
#sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:#fff;box-shadow:2px 0 20px rgba(0,0,0,.12);z-index:100;display:flex;flex-direction:column;transition:left .25s cubic-bezier(.4,0,.2,1)}
body.dark #sidebar{background:#1e1e1a}
#sidebar.open{left:0}
#sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;display:none}
#sidebar-overlay.on{display:block}
#sidebar-header{padding:16px;border-bottom:1px solid #f0ece6;box-sizing:border-box}
body.dark #sidebar-header{border-color:#2a2720}
#sidebar-user-name{font-size:13px;font-weight:600;color:#1a1a18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dark #sidebar-user-name{color:#e0dbd5}
#sidebar-user-email{font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sidebar-body{flex:1;overflow-y:auto;padding:8px 0}
.sb-btn{display:flex;align-items:center;gap:12px;padding:11px 20px;border:none;background:none;width:100%;text-align:left;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;color:#444;transition:background .15s}
.sb-btn:hover{background:#f5f2ee}
body.dark .sb-btn{color:#ccc}
body.dark .sb-btn:hover{background:#2a2a25}
.sb-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sb-divider{height:1px;background:#f0ece6;margin:6px 16px}
body.dark .sb-divider{background:#2a2720}
#hamburger{background:none;border:none;cursor:pointer;padding:4px 8px;font-size:20px;color:#888;line-height:1;border-radius:6px}
#hamburger:hover{background:#f0ece6}
body.dark #hamburger:hover{background:#2a2a25}

/* ── Filtros ── */
#fbar{display:flex;align-items:center;gap:8px;padding:5px 16px;flex-shrink:0;flex-wrap:wrap;border-bottom:1px solid #f0ece6;background:#fff;transition:background .3s,border-color .3s}
body.dark #fbar{background:#1e1e1a;border-color:#2a2720}
.flbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
#fchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
#fstat{margin-left:auto;font-size:10px;color:#999}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:14px;border:1px solid var(--fc,#888);color:var(--fc,#888);font-size:11px;font-weight:500;cursor:pointer;user-select:none;background:transparent;transition:background .15s,color .15s}
.fchip:hover{background:color-mix(in srgb,var(--fc,#888) 14%,transparent)}
.fchip.on{background:var(--fc,#888);color:#fff}
.fchip .fe{opacity:.7;font-size:11px}
.fchip .fe:hover{opacity:1}
.fpk-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.fpk-none{font-size:11px;color:#bbb}
.fpk-add{display:flex;gap:6px;align-items:center}
.fpk-add input{flex:1}
.flt-list{max-height:230px;overflow-y:auto;border:1px solid #e8e4df;border-radius:8px;padding:4px;margin-bottom:2px}
body.dark .flt-list{border-color:#3a3730}
.flt-row{display:flex;align-items:flex-start;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:11px;line-height:1.35}
.flt-row:hover{background:#f5f2ee}
body.dark .flt-row:hover{background:#2a2a25}
.flt-row input{width:auto;margin-top:2px;flex-shrink:0;cursor:pointer}
.flt-yr{color:#999;min-width:50px;flex-shrink:0;font-size:10px;padding-top:1px}
.flt-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;margin-top:3px}
.flt-sub{color:#999;font-size:10px;margin-left:4px}
.flt-sec{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:#aaa;padding:6px 6px 2px;font-weight:600}
.flt-count{font-size:10px;color:#999;margin-bottom:6px}
.flt-empty{font-size:11px;color:#bbb;padding:8px;text-align:center}
</style>

<div id="projects-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center">

// Capture raw source template for export (before DOM mutations)

// ── Cores: não há paleta pré-definida. As cores disponíveis são as que já foram usadas ──
// em algum evento ou chave da linha do tempo (as mais usadas primeiro).
function usedColors(){
  var cnt={}, order=[];
  function add(c){
    if(!c||typeof c!=='string'||c.charAt(0)!=='#')return;
    c=c.toLowerCase();
    if(!(c in cnt)){cnt[c]=0;order.push(c);}
    cnt[c]++;
  }
  marks.slice().sort(function(a,b){return a.year-b.year;}).forEach(function(m){
    (m.events||[]).forEach(function(e){add(e.color);});
  });
  brackets.forEach(function(b){add(b.color);});
  return order.map(function(c,i){return {c:c,i:i,n:cnt[c]};})
    .sort(function(a,b){return (b.n-a.n)||(a.i-b.i);})
    .map(function(o){return o.c;});
}

// ── Descrição: nunca mais larga que o título do evento ──
function dfs(){return Math.max(5,efs()*0.78);}       // fonte da descrição do evento
function dcw(fs){return fs*0.54;}                     // largura estimada por caractere (itálico, minúsculas)
function fitOneLine(text,maxW,fs){                    // uma linha só, cortada com … se não couber
  var cw=dcw(fs), maxCh=Math.max(1,Math.floor(maxW/cw));
  if(text.length<=maxCh)return text;
  return text.slice(0,Math.max(1,maxCh-1)).replace(/\s+$/,'')+'…';
}
// Descrição do evento: sempre UMA linha, com no máximo a largura do título.
// Se o título for tão curto que nem 4 palavras cabem, mostra pelo menos 4 palavras inteiras.
var MIN_DESC_WORDS=4;
function evDescLine(ev){
  if(!ev||!ev.desc)return '';
  var full=String(ev.desc).trim().replace(/\s+/g,' ');
  if(!full)return '';
  var maxCh=Math.max(1,Math.floor(tw(ev.text,efs())/dcw(dfs())));
  if(full.length<=maxCh)return full;                   // cabe inteira
  var words=full.split(' '), line='', n=0;
  for(var i=0;i<words.length;i++){                     // palavras inteiras que cabem (1 caractere fica para o …)
    var cand=line?line+' '+words[i]:words[i];
    if(cand.length>maxCh-1)break;
    line=cand; n++;
  }
  if(n<MIN_DESC_WORDS){                                // título curto: garante o mínimo de palavras
    n=Math.min(MIN_DESC_WORDS,words.length);
    line=words.slice(0,n).join(' ');
  }
  return n<words.length?line+'…':line;
}
function evDescW(ev){var l=evDescLine(ev);return l?l.length*dcw(dfs()):0;}
function evH(ev){                                      // altura que o evento ocupa na coluna
  var h=efs()*1.55;
  return ev&&ev.desc&&evDescLine(ev)?h+dfs()*1.2+2:h;
}
var BG='#fafaf8', FN="'DM Sans',sans-serif";
var zoom=1, _id=Date.now(), cf=0.5, TLY=280, BLH=24, W=3200, H=600;

// ── Filtros: lógica de visibilidade ──
function findFilter(id){for(var i=0;i<filters.length;i++){if(filters[i].id===id)return filters[i];}return null;}
function inF(it,fid){return !!(it&&it.flt&&it.flt.indexOf(fid)>=0);}
function passF(it){
  if(!it||!it.flt)return false;
  for(var i=0;i<activeFilters.length;i++){if(it.flt.indexOf(activeFilters[i])>=0)return true;}
  return false;
}
function isFiltering(){return activeFilters.length>0;}
function visBrackets(){return isFiltering()?brackets.filter(passF):brackets;}
// Com filtro ligado: TODOS os anos continuam na linha. Só mudam os eventos:
// os do filtro aparecem com texto (events) e os de fora viram bolinhas coloridas embaixo do ano (hid).
function gs(){
  var all=marks.slice().sort(function(a,b){return a.year-b.year;});
  if(!isFiltering())return all;
  return all.map(function(m){
    var evs=[], hid=[];
    (m.events||[]).forEach(function(e){(passF(e)?evs:hid).push(e);});
    return {year:m.year,events:evs,hid:hid};
  });
}
// altura que a coluna de um ano ocupa: textos dos eventos + pilha de bolinhas

function dotStep(){return dotR()*2+2.5;}
function colH(mk){
  var h=0;
  (mk.events||[]).forEach(function(e){h+=evH(e);});
  if(mk.hid&&mk.hid.length)h+=mk.hid.length*dotStep()+4;
  return h;
}
var RM=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
function rom(n){var r='';for(var i=0;i<RM.length;i++){while(n>=RM[i][0]){r+=RM[i][1];n-=RM[i][0];}}return r;}
function yl(y){if(y<0)return Math.abs(y)+' a.C.';if(y>=100&&y<=1400&&y%100===0)return 'SEC '+rom(Math.round(y/100));return String(y);}

var drag={on:false,x:0,y:0,sl:0,st:0,moved:false};
var wp2=document.getElementById('wrap');
var DRAG_THRESHOLD=5; // pixels before we consider it a drag

wp2.addEventListener('mousedown',function(e){
  // Only left button; skip if clicking on form elements
  if(e.button!==0)return;

  drag={on:true,x:e.pageX,y:e.pageY,sl:wp2.scrollLeft,st:wp2.scrollTop,moved:false};

  e.preventDefault();

window.addEventListener('mousemove',function(e){
  if(!drag.on)return;
  var dx=e.pageX-drag.x, dy=e.pageY-drag.y;
  if(!drag.moved&&(Math.abs(dx)>DRAG_THRESHOLD||Math.abs(dy)>DRAG_THRESHOLD)){
    drag.moved=true;

  if(drag.moved){
    wp2.scrollLeft=drag.sl-dx;
    wp2.scrollTop=drag.st-dy;

var scrollInicialL=0;
var scrollInicialT=0;
var anchorX=0; // ponto do conteúdo sob os dedos no inicio
var anchorY=0;
var startCx=0; // posição dos dedos na tela no inicio
var startCy=0;
var escalaAtual=1;
var pinchFIdx=null; // índice fracionário do conteúdo sob os dedos
var pinchYear=null; // modo Décadas: ano sob os dedos
var lastCx=0, lastCy=0; // última posição dos dedos

function distancia(t){
  return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
}

wp2.addEventListener('touchstart',function(e){
  if(e.touches.length===2){
    e.preventDefault();
    touch.on=false;
    touch.pinch=true;
    var rc=wp2.getBoundingClientRect();
    // Centro entre os dois dedos (relativo ao container)
    startCx=(e.touches[0].clientX+e.touches[1].clientX)/2-rc.left;
    startCy=(e.touches[0].clientY+e.touches[1].clientY)/2-rc.top;
    // Distância inicial entre os dedos
    distanciaInicial=distancia(e.touches);
    // Zoom e scroll no início do gesto
    zoomInicial=zoom;
    scrollInicialL=wp2.scrollLeft;
    scrollInicialT=wp2.scrollTop;
    // Ponto do conteúdo sob os dedos
    anchorX=scrollInicialL+startCx;
    anchorY=scrollInicialT+startCy;
    // Converte anchorX para índice fracionário entre as marcas (independe de zoom)
    // xi(i) = centerOffset + i*Gst, então: fIdx = (anchorX - centerOffset)/Gst
    if(Gs.length>0&&Gst>0){
      pinchFIdx=(anchorX-_XI_MARGIN)/Gst;
    } else {
      pinchFIdx=null;
    }
    pinchYear=(propMode&&_pAnch.length)?yearAtX(anchorX):null;
    lastCx=startCx; lastCy=startCy;
    escalaAtual=1;
    svgEl.style.transformOrigin='0 0';
    svgEl.style.transform='';
  } else if(e.touches.length===1&&!touch.pinch){
    touch={on:true,pinch:false,x:e.touches[0].pageX,y:e.touches[0].pageY,
           sl:wp2.scrollLeft,st:wp2.scrollTop,moved:false};
  }
},{passive:false});

wp2.addEventListener('touchmove',function(e){
  if(touch.pinch&&e.touches.length===2){
    e.preventDefault();
    var rc=wp2.getBoundingClientRect();
    // Centro atual dos dedos
    var cx=(e.touches[0].clientX+e.touches[1].clientX)/2-rc.left;
    var cy=(e.touches[0].clientY+e.touches[1].clientY)/2-rc.top;
    // Nova distância
    var distanciaAtual=distancia(e.touches);
    // Fator de escala relativo ao INÍCIO (não ao frame anterior — evita drift)
    var fatorEscala=distanciaAtual/distanciaInicial;
    // Limita o zoom
    var novoZoom=Math.min(Math.max(zoomInicial*fatorEscala,0.25),5);
    fatorEscala=novoZoom/zoomInicial;
    // Aplica transform visual (suave, GPU)
    svgEl.style.transform='scale('+fatorEscala+')';
    // Ajusta scroll para manter o ponto anchorado sob os dedos
    wp2.scrollLeft=anchorX*fatorEscala-cx;
    wp2.scrollTop=anchorY*fatorEscala-cy;
    // Guarda para touchend
    lastCx=cx; lastCy=cy;
    escalaAtual=fatorEscala;
    zoom=novoZoom;
    document.getElementById('zl').textContent=Math.round(zoom*100)+'%';
  } else if(touch.on&&e.touches.length===1){
    var dx=e.touches[0].pageX-touch.x,dy=e.touches[0].pageY-touch.y;
    if(!touch.moved&&(Math.abs(dx)>DRAG_THRESHOLD||Math.abs(dy)>DRAG_THRESHOLD))touch.moved=true;
    if(touch.moved){wp2.scrollLeft=touch.sl-dx;wp2.scrollTop=touch.st-dy;e.preventDefault();}
  }
},{passive:false});

wp2.addEventListener('touchend',function(e){
  if(touch.pinch&&e.touches.length<2){
    // Remove transform e redesenha com zoom real
    svgEl.style.transform='';
    var _fIdx=pinchFIdx, _cx=lastCx, _cy=lastCy;
    var _py=pinchYear;   // modo Décadas: ano que estava sob os dedos
    var _fallbackSL=anchorX*escalaAtual-lastCx;
    var _fallbackST=anchorY*escalaAtual-lastCy;
    draw(false);
    // Após o draw, _XI_MARGIN e Gst foram recalculados para o novo zoom.
    // Reconverte o índice fracionário para pixel na nova geometria — exato.
    requestAnimationFrame(function(){
      if(_py!==null){
        wp2.scrollLeft=xOf(_py)-_cx;
      } else if(_fIdx!==null&&Gs.length>0&&Gst>0){
        wp2.scrollLeft=(_XI_MARGIN+_fIdx*Gst)-_cx;
      } else {
        wp2.scrollLeft=_fallbackSL;
      }
      wp2.scrollTop=_fallbackST;
    });
    touch.pinch=false;
    escalaAtual=1;
    if(e.touches.length===1){
      touch={on:true,pinch:false,x:e.touches[0].pageX,y:e.touches[0].pageY,
             sl:wp2.scrollLeft,st:wp2.scrollTop,moved:false};
    }
  } else if(e.touches.length===0){
    touch.on=false;
    touch.pinch=false;
  }
},{passive:true});

function sm(el){
  var md=document.getElementById('md');
  md.style.width='';
  while(md.firstChild)md.removeChild(md.firstChild);
  md.appendChild(el);
  document.getElementById('ov').className='on';
  // Auto-focus first input so Enter works immediately
  setTimeout(function(){
    var first=md.querySelector('input:not([type=hidden]),textarea,select');
    if(first) first.focus();
  },60);
}
function cm(){
  document.getElementById('ov').className='';
}

function mkEl(tag,props,txt){
  var e=document.createElement(tag);
  for(var k in props){
    if(k==='style')e.style.cssText=props[k];
    else if(k==='className')e.className=props[k];
    else if(k==='textContent')e.textContent=props[k];
    else e.setAttribute(k,props[k]);
  }
  if(txt!==undefined)e.textContent=txt;
  return e;
}
function ap(parent,children){
  if(!Array.isArray(children))children=[children];
  children.forEach(function(c){if(c)parent.appendChild(c);});
  return parent;
}
function mkBtn(label,cls,fn){
  var b=mkEl('button',{className:cls||''});
  b.textContent=label;
  b.addEventListener('click',fn);
  return b;
}
function mkField(label,input){
  var d=mkEl('div',{className:'fi'});
  ap(d,[mkEl('label',{textContent:label}),input]);
  return d;
}
function mkInp(type,val,id){
  var i=mkEl('input',{type:type,value:val||''});
  if(id)i.id=id;
  return i;
}
function mkSel(id,opts,sel){
  var s=mkEl('select',{}); s.id=id;
  opts.forEach(function(o){
    var op=mkEl('option',{value:o[0],textContent:o[1]});
    if(o[0]===sel)op.selected=true;
    s.appendChild(op);
  });
  return s;
}
function mkRow(children){return ap(mkEl('div',{className:'r2'}),children);}
function mkMb(buttons){return ap(mkEl('div',{className:'mb'}),buttons);}
function mkBox(title,body,buttons){
  var box=mkEl('div',{});
  ap(box,[mkEl('div',{className:'mh',textContent:title})]);
  body.forEach(function(b){if(b)box.appendChild(b);});
  var mb=mkMb(buttons);
  box.appendChild(mb);
  // Enter em qualquer campo (exceto textarea) aciona o botão de salvar
  box.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='textarea')return;
    e.preventDefault();
    // Encontra o botão de ação (último com classe bg/bo/bb)
    var btns=mb.querySelectorAll('button');
    var saveBtn=null;
    for(var i=btns.length-1;i>=0;i--){
      var cl=btns[i].className;
      if(cl==='bg'||cl==='bo'||cl==='bb'){saveBtn=btns[i];break;}
    }
    if(saveBtn)saveBtn.click();
  });
  return box;
}

function mkCph(pid,val){
  var wrap=mkEl('div',{});
  var pal=mkEl('div',{style:'display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px'});
  pal.id='cpal-'+pid;
  // Sem cores pré-definidas: só aparecem as cores que já foram usadas na linha do tempo
  var used=usedColors();
  used.forEach(function(c){
    var s=mkEl('div',{title:c,'data-c':c,style:'width:22px;height:22px;border-radius:5px;cursor:pointer;background:'+c+';border:'+(String(val).toLowerCase()===c?'2px solid #000':'2px solid transparent')+';box-sizing:border-box'});
    s.addEventListener('click',function(){pcn(pid,c);});
    pal.appendChild(s);
  });
  if(!used.length)pal.appendChild(mkEl('span',{style:'font-size:11px;color:#bbb',textContent:'As cores que você usar ficam salvas aqui. Escolha a primeira no seletor abaixo.'}));
  var row=mkEl('div',{style:'display:flex;align-items:center;gap:5px;margin-top:4px'});
  var nc=mkEl('input',{type:'color',value:val,style:'width:30px;height:26px;border:none;padding:0;cursor:pointer;background:none'});
  nc.id='cn-'+pid;
  nc.addEventListener('input',function(){pcn(pid,this.value);});
  var tc=mkEl('input',{type:'text',value:val,style:'flex:1;font-size:12px;padding:5px 8px;border-radius:7px;border:1px solid #ddd;outline:none'});
  tc.id='ct-'+pid;
  tc.addEventListener('input',function(){pcn(pid,this.value);});
  var pv=mkEl('div',{style:'width:26px;height:26px;border-radius:5px;border:1px solid #ddd;background:'+val});
  pv.id='cv-'+pid;
  ap(row,[nc,tc,pv]);
  ap(wrap,[pal,row]);
  return wrap;
}
function pcn(pid,v){
  var t=document.getElementById('ct-'+pid);
  var n=document.getElementById('cn-'+pid);
  var p=document.getElementById('cv-'+pid);
  if(t)t.value=v;
  if(n){try{n.value=v;}catch(x){}}
  if(p)p.style.background=v;
  var pal=document.getElementById('cpal-'+pid);
  if(pal){
    Array.prototype.forEach.call(pal.children,function(s){
      var c=s.getAttribute('data-c'); if(!c)return;
      s.style.border=(c===String(v).toLowerCase())?'2px solid #000':'2px solid transparent';
    });
  }
}
function gc(pid){var t=document.getElementById('ct-'+pid);return t?t.value:'#374151';}

function oee(year,eid){
  var mk=null,ev=null;
  for(var i=0;i<marks.length;i++){if(marks[i].year===year){mk=marks[i];break;}} if(!mk)return;
  for(var i=0;i<mk.events.length;i++){if(mk.events[i].id===eid){ev=mk.events[i];break;}} if(!ev)return;
  var ti=mkInp('text',ev.text,'eet');
  var di=mkEl('textarea',{id:'eed'});di.value=ev.desc||'';di.placeholder='Descrição opcional...';
  var cplbl=mkEl('div',{className:'fi'});
  ap(cplbl,[mkEl('label',{textContent:'Cor'}),mkCph('ev',ev.color)]);
  var pk=mkFilterPicker(ev.flt);
  sm(mkBox('Editar Evento',[mkField('Texto',ti),mkField('Descrição',di),cplbl,pk.el],[
    mkBtn('Excluir','',function(){dle(year,eid);}),
    mkBtn('Voltar','',function(){oem(year);}),
    mkBtn('Salvar','bg',function(){sev(year,eid,pk.get());})
  ]));
}
function sev(year,eid,fl){
  _snapshot();
  var txt=document.getElementById('eet').value.toUpperCase().trim(), col=gc('ev');
  var desc=document.getElementById('eed').value.trim();
  for(var i=0;i<marks.length;i++){if(marks[i].year===year){for(var j=0;j<marks[i].events.length;j++){if(marks[i].events[j].id===eid){marks[i].events[j].text=txt;marks[i].events[j].color=col;marks[i].events[j].desc=desc;_setFlt(marks[i].events[j],fl);break;}}break;}}
  cm(); draw(true);
}
function dle(year,eid){

  cm(); draw(true);

var FPAL=['#2563eb','#16a34a','#c0392b','#d97706','#7c3aed','#0891b2','#db2777','#65a30d'];
function nextFilterColor(){return FPAL[filters.length%FPAL.length];}
function _nz(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function _setFlt(it,fl){
  if(!it||!fl)return;
  if(fl.length)it.flt=fl.slice(); else delete it.flt;
}
function eachItem(fn){
  marks.forEach(function(m){(m.events||[]).forEach(function(ev){fn(ev);});});
  brackets.forEach(function(b){fn(b);});
}
function countItems(fid){var n=0;eachItem(function(it){if(inF(it,fid))n++;});return n;}
function loadFilters(raw){
  var arr=[];
  try{arr=(typeof raw==='string')?JSON.parse(raw||'[]'):(raw||[]);}catch(e){arr=[];}
  if(!Array.isArray(arr))arr=[];
  filters=arr.filter(function(f){return f&&f.id&&f.name;});
  activeFilters=[];
  renderFilterBar();
}

// Ano que está no centro da tela (para não "pular" ao ligar/desligar um filtro)
function centerYear(){
  var w=document.getElementById('wrap');
  if(!w||!Gs.length)return null;
  var cx=w.scrollLeft+w.clientWidth/2,best=null,bd=1e15;
  for(var i=0;i<Gs.length;i++){var d=Math.abs(xi(i)-cx);if(d<bd){bd=d;best=Gs[i].year;}}
  return best;
}
function applyFilterChange(change){
  var cy=centerYear();
  change();
  var s=gs();
  if(s.length){
    if(cy===null)cy=s[0].year;
    _scrollToYear=Math.max(s[0].year,Math.min(cy,s[s.length-1].year));
  }

// Seletor de filtros usado nos cards de evento e de chave.
// Retorna {el, get()} — get() devolve os ids dos filtros marcados.
function mkFilterPicker(sel){
  var selected=(sel||[]).filter(function(id){return !!findFilter(id);});
  var box=mkEl('div',{className:'fi'});
  var chips=mkEl('div',{className:'fpk-chips'});
  var inp=mkEl('input',{type:'text',placeholder:'Criar novo filtro e adicionar...'});
  var addBtn=mkEl('button',{type:'button',className:'bb',title:'Criar filtro'});
  addBtn.textContent='+ Criar';
  var row=mkEl('div',{className:'fpk-add'});
  ap(row,[inp,addBtn]);
  ap(box,[mkEl('label',{textContent:'Filtros'}),chips,row]);
  function render(){
    while(chips.firstChild)chips.removeChild(chips.firstChild);
    if(!filters.length){chips.appendChild(mkEl('span',{className:'fpk-none',textContent:'Nenhum filtro ainda — crie o primeiro abaixo.'}));return;}
    filters.forEach(function(f){
      var on=selected.indexOf(f.id)>=0;
      var c=mkEl('span',{className:'fchip'+(on?' on':'')});
      c.style.setProperty('--fc',f.color);
      c.textContent=(on?'✓ ':'')+f.name;
      c.addEventListener('click',function(){
        var ix=selected.indexOf(f.id);
        if(ix>=0)selected.splice(ix,1); else selected.push(f.id);
        render();
      });
      chips.appendChild(c);
    });
  }
  function add(){
    var nm=inp.value.trim(); if(!nm)return;
    var ex=null;
    filters.forEach(function(f){if(_nz(f.name)===_nz(nm))ex=f;});
    if(!ex){
      _snapshot();
      ex={id:uid(),name:nm,color:nextFilterColor()};
      filters.push(ex);
      renderFilterBar();
    }
    if(selected.indexOf(ex.id)<0)selected.push(ex.id);
    inp.value='';
    render();
  }
  addBtn.addEventListener('click',function(e){e.preventDefault();add();});
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();e.stopPropagation();add();}
  });
  render();
  return {el:box,get:function(){return selected.slice();}};
}

function newFilter(){openFilterEditor(null);}
function openFilterEditor(fid){
  var f=fid?findFilter(fid):null;
  if(fid&&!f)return;
  var sel={};
  if(f)eachItem(function(it){if(inF(it,f.id))sel[it.id]=true;});
  var ni=mkInp('text',f?f.name:'','flt-name'); ni.placeholder='Ex: Brasil Império';
  var cp=mkEl('div',{className:'fi'});
  ap(cp,[mkEl('label',{textContent:'Cor'}),mkCph('fl',f?f.color:nextFilterColor())]);
  var si=mkInp('text','','flt-search'); si.placeholder='Buscar por nome ou ano...';
  var list=mkEl('div',{className:'flt-list'});
  var cnt=mkEl('div',{className:'flt-count'});
  function updCount(){var n=Object.keys(sel).length;cnt.textContent=n+(n===1?' item selecionado':' itens selecionados');}
  function mkItemRow(id,dotColor,yr,text,sub){
    var lb=mkEl('label',{className:'flt-row'});
    var cb=mkEl('input',{type:'checkbox'}); cb.checked=!!sel[id];
    cb.addEventListener('change',function(){if(cb.checked)sel[id]=true; else delete sel[id]; updCount();});
    var dot=mkEl('span',{className:'flt-dot',style:'background:'+dotColor});
    var y=mkEl('span',{className:'flt-yr'}); y.textContent=yr;
    var tx=mkEl('span',{}); tx.textContent=text;
    if(sub){var sp=mkEl('span',{className:'flt-sub'}); sp.textContent=sub; tx.appendChild(sp);}
    ap(lb,[cb,dot,y,tx]);
    return lb;
  }
  function rebuild(){
    while(list.firstChild)list.removeChild(list.firstChild);
    var q=_nz(si.value.trim());
    var evRows=[];
    marks.slice().sort(function(a,b){return a.year-b.year;}).forEach(function(m){
      (m.events||[]).forEach(function(ev){
        if(!q||_nz(ev.text+' '+yl(m.year)+' '+m.year).indexOf(q)>=0)evRows.push({m:m,ev:ev});
      });
    });
    var brRows=brackets.slice().sort(function(a,b){return a.from-b.from;}).filter(function(b){
      return !q||_nz(b.label+' '+b.from+' '+b.to+' '+yl(b.from)+' '+yl(b.to)).indexOf(q)>=0;
    });
    if(evRows.length){
      list.appendChild(mkEl('div',{className:'flt-sec',textContent:'Eventos'}));
      evRows.forEach(function(o){list.appendChild(mkItemRow(o.ev.id,o.ev.color,yl(o.m.year),o.ev.text));});
    }
    if(brRows.length){
      list.appendChild(mkEl('div',{className:'flt-sec',textContent:'Chaves'}));
      brRows.forEach(function(b){list.appendChild(mkItemRow(b.id,b.color,yl(b.from),b.label,yl(b.from)+' – '+yl(b.to)));});
    }
    if(!evRows.length&&!brRows.length){
      list.appendChild(mkEl('div',{className:'flt-empty',textContent:q?'Nada encontrado.':'Ainda não há eventos nem chaves na linha do tempo.'}));
    }
  }
  si.addEventListener('input',rebuild);
  si.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();e.stopPropagation();}});
  function saveFilter(){
    var nm=ni.value.trim();
    if(!nm){alert('Dê um nome ao filtro.');return;}
    var dup=false;
    filters.forEach(function(o){if((!f||o.id!==f.id)&&_nz(o.name)===_nz(nm))dup=true;});
    if(dup){alert('Já existe um filtro com esse nome.');return;}
    _snapshot();
    var col=gc('fl');
    var target=f;
    if(!target){target={id:uid(),name:nm,color:col};filters.push(target);}
    else{target.name=nm;target.color=col;}
    eachItem(function(it){
      var want=!!sel[it.id], has=inF(it,target.id);
      if(want&&!has){it.flt=(it.flt||[]).concat([target.id]);}
      else if(!want&&has){
        it.flt=it.flt.filter(function(x){return x!==target.id;});
        if(!it.flt.length)delete it.flt;
      }
    });
    cm(); renderFilterBar(); draw(true);
  }
  var btns=[];
  if(f)btns.push(mkBtn('Excluir filtro','',function(){deleteFilter(f.id);}));
  btns.push(mkBtn('Cancelar','',cm));
  btns.push(mkBtn(f?'Salvar':'Criar filtro','bg',saveFilter));
  sm(mkBox(f?'Editar Filtro':'Novo Filtro',[mkField('Nome',ni),cp,mkField('Eventos e chaves do filtro',si),list,cnt],btns));
  document.getElementById('md').style.width='380px';
  rebuild(); updCount();
}
function deleteFilter(fid){
  var f=findFilter(fid); if(!f)return;
  if(!confirm('Excluir o filtro "'+f.name+'"? Os eventos continuam na linha do tempo, só deixam de pertencer a ele.'))return;
  _snapshot();
  eachItem(function(it){
    if(inF(it,fid)){
      it.flt=it.flt.filter(function(x){return x!==fid;});
      if(!it.flt.length)delete it.flt;
    }
  });
  filters=filters.filter(function(x){return x.id!==fid;});
  cm();
  applyFilterChange(function(){activeFilters=activeFilters.filter(function(x){return x!==fid;});});
}

function doExp(){
  var ms=JSON.stringify(marks), bs=JSON.stringify(brackets), fs2=JSON.stringify(filters);
  // Use the cached source template captured at page load (avoids outerHTML corruption)
  var h=_srcTemplate;
  var M1='<!--MDATA-->', M2='<!--BDATA-->';
  h=h.replace(M1,ms).replace(M2,bs).replace('<!--FDATA-->',function(){return fs2;});
  var blob=new Blob([h],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='linha_do_tempo.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

// ── PNG export ──
function expPDF(){
  var svgEl2=document.getElementById('svg');
  var w=parseInt(svgEl2.getAttribute('width')), h=parseInt(svgEl2.getAttribute('height'));
  var svgData=new XMLSerializer().serializeToString(svgEl2);
  var b64=btoa(unescape(encodeURIComponent(svgData)));
  var url='data:image/svg+xml;base64,'+b64;
  var img=new Image();
  img.onload=function(){
    var scale=2;
    var canvas=document.createElement('canvas');
    canvas.width=w*scale; canvas.height=h*scale;
    var ctx2=canvas.getContext('2d');
    ctx2.scale(scale,scale);
    ctx2.fillStyle=BG; ctx2.fillRect(0,0,w,h);
    ctx2.drawImage(img,0,0,w,h);
    // Use jsPDF via CDN
    var script=document.createElement('script');
    script.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload=function(){
      var pdf=new window.jspdf.jsPDF({
        orientation: w>h?'landscape':'portrait',
        unit:'px',
        format:[w,h]
      });
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,h);
      pdf.save((_currentProjectName||'linha_do_tempo')+'.pdf');
    };
    script.onerror=function(){
      // Fallback: open SVG in new tab for printing
      var win=window.open('','_blank');
      win.document.write('<html><head><title>'+(_currentProjectName||'Linha do Tempo')+'</title><style>body{margin:0}svg{width:100%;height:auto}</style></head><body>'+svgData+'</body></html>');
      win.document.close();
      setTimeout(function(){win.print();},500);
    };
    document.head.appendChild(script);
  };
  img.src=url;
}

var _tip=document.getElementById('tip');
var _tipTimer=null;
function showTip(e,text){
  clearTimeout(_tipTimer);
  _tipTimer=setTimeout(function(){
    _tip.textContent=text;
    _tip.style.display='block';
    moveTip(e);
  },320);
}
function moveTip(e){
  if(_tip.style.display==='none')return;
  var x=e.clientX+14, y=e.clientY-10;
  var tw=_tip.offsetWidth, th=_tip.offsetHeight;
  if(x+tw>window.innerWidth-10) x=e.clientX-tw-14;
  if(y+th>window.innerHeight-10) y=e.clientY-th-10;
  _tip.style.left=x+'px';
  _tip.style.top=y+'px';
}
function hideTip(){
  clearTimeout(_tipTimer);
  _tip.style.display='none';
}
function attachTip(el,text){
  if(!text)return;
  el.addEventListener('mouseenter',function(e){showTip(e,text);});
  el.addEventListener('mousemove',moveTip);
  el.addEventListener('mouseleave',hideTip);
  el.addEventListener('click',hideTip);
}

function fbSave(){
  if(!_fbUser){ alert('Faça login primeiro!'); return; }
  if(marks.length === 0 && brackets.length === 0 && !_currentProjectName){ alert('Nada para salvar — a linha do tempo está vazia.'); return; }
  var btn = document.getElementById('save-btn');
  btn.textContent = '☁ Salvando...';
  btn.disabled = true;
  var projectData = {
    name: _currentProjectName,
    marks: JSON.stringify(marks),
    brackets: JSON.stringify(brackets),
    filters: JSON.stringify(filters),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  var ref;
  if(_currentProjectId){
    ref = db.collection('users').doc(_fbUser.uid).collection('projects').doc(_currentProjectId).set(projectData);
  } else {
    ref = db.collection('users').doc(_fbUser.uid).collection('projects').add(projectData).then(function(docRef){
      _currentProjectId = docRef.id;
    });
  }
  ref.then(function(){
    btn.textContent = '✓ Salvo!';
    updateProjectNameDisplay();
    setTimeout(function(){ btn.textContent = '☁ Salvar'; btn.disabled = false; }, 2000);
  }).catch(function(e){
    btn.textContent = '☁ Salvar';
    btn.disabled = false;
    alert('Erro ao salvar: ' + e.message);
  });
}

function fbLoad(){
  if(!_fbUser) return;
  db.collection('users').doc(_fbUser.uid).collection('projects')
    .orderBy('updatedAt','desc').limit(1).get().then(function(snap){
      if(!snap.empty){
        var doc = snap.docs[0];
        var d = doc.data();
        try {
          marks = JSON.parse(d.marks||'[]');
          brackets = JSON.parse(d.brackets||'[]');
          loadFilters(d.filters);
          _currentProjectId = doc.id;
          _currentProjectName = d.name||'Minha Linha do Tempo';
          _undoStack = []; _redoStack = [];
          if(marks.length>0){
            var sorted2=marks.slice().sort(function(a,b){return a.year-b.year;});
            _lastAddedYear=sorted2[sorted2.length-1].year;
            _scrollToYear=sorted2[0].year;
          }
          cm(); draw(true);
        } catch(e){ console.error('Erro:', e); }
        updateBlankState(); updateProjectNameDisplay();
      } else {
        // Tenta migrar do formato antigo
        db.collection('timelines').doc(_fbUser.uid).get().then(function(oldDoc){
          if(oldDoc.exists){
            var d = oldDoc.data();
            try {
              var om = JSON.parse(d.marks||'[]');
              var ob = JSON.parse(d.brackets||'[]');
              if(om.length>0||ob.length>0){
                marks=om; brackets=ob; loadFilters([]);
                _currentProjectName='Minha Linha do Tempo';
                _currentProjectId=null;
                _undoStack=[]; _redoStack=[];
                cm(); draw(true);
                fbSave(); // salva no novo formato
              }
            } catch(e){ console.error('Erro migração:',e); }
          }
          updateBlankState(); updateProjectNameDisplay();
        }).catch(function(){ updateBlankState(); updateProjectNameDisplay(); });
      }
    }).catch(function(e){ 
      console.error('Firestore error:', e);
      updateBlankState(); updateProjectNameDisplay(); 
    });
}

      snap.forEach(function(doc){
        var d = doc.data();
        var item = document.createElement('div');
        item.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #e8e4df;border-radius:10px;cursor:pointer';
        item.innerHTML = '<div style="flex:1"><div style="font-size:13px;font-weight:500">'+(d.name||'Sem título')+'</div><div style="font-size:10px;color:#aaa">'+(d.updatedAt?new Date(d.updatedAt.toDate()).toLocaleDateString('pt-BR'):'')+'</div></div>'
          +'<button style="padding:4px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:11px" onclick="event.stopPropagation();deleteProject(\''+doc.id+'\',\''+encodeURIComponent(d.name||'')+'\')">🗑</button>';
        item.addEventListener('click', function(){ openProject(doc.id, d.name||'Sem título'); });
        list.appendChild(item);
      });
    });
}

function _doCreateProject(){
  var name=document.getElementById('new-proj-name');
  if(!name||!name.value.trim()){alert('Digite um nome para o projeto.');return;}
  marks=[]; brackets=[]; loadFilters([]);
  _currentProjectName=name.value.trim();
  _currentProjectId=null;
  cf=0.5;
  closeProjects();
  cm(); draw(false);
  updateBlankState();
  updateProjectNameDisplay();
  if(_fbUser) fbSave();
}
function newProject(){
  var ni=mkInp('text','','new-proj-name'); ni.placeholder='Ex: História do Brasil';
  sm(mkBox('Novo Projeto',[mkField('Nome do projeto',ni)],[
    mkBtn('Cancelar','',cm),
    mkBtn('Criar','bg',_doCreateProject)
  ]));
  setTimeout(function(){var i=document.getElementById('new-proj-name');if(i)i.focus();},80);
}

function openProject(id, name){
  db.collection('users').doc(_fbUser.uid).collection('projects').doc(id).get().then(function(doc){
    if(!doc.exists) return;
    var d = doc.data();
    try {
      marks = JSON.parse(d.marks||'[]');
      brackets = JSON.parse(d.brackets||'[]');
      loadFilters(d.filters);
      _currentProjectId = id;
      _currentProjectName = name;
      _undoStack = []; _redoStack = [];
      closeProjects();
      cm(); draw(true);
      updateBlankState();
      updateProjectNameDisplay();
    } catch(e){ alert('Erro ao abrir projeto.'); }
  });
}

function deleteProject(id, encodedName){
  var name = decodeURIComponent(encodedName);
  if(!confirm('Excluir o projeto "'+name+'"? Isso não pode ser desfeito.')) return;
  db.collection('users').doc(_fbUser.uid).collection('projects').doc(id).delete().then(function(){
    if(_currentProjectId === id){ marks=[]; brackets=[]; loadFilters([]); _currentProjectId=null; _currentProjectName='Sem título'; cm(); draw(true); updateBlankState(); updateProjectNameDisplay(); }
    loadProjectsList();
  });
}

// ── Import ──
function showImport(){
  document.getElementById('import-modal').style.display = 'flex';
  document.getElementById('import-status').textContent = '';
}

function closeImport(){
  document.getElementById('import-modal').style.display = 'none';
  document.getElementById('import-file').value = '';
}

function handleImport(event){
  var file = event.target.files[0];
  if(!file) return;
  var status = document.getElementById('import-status');
  status.textContent = 'Lendo arquivo...';
  var reader = new FileReader();
  reader.onload = function(e){
    var text = e.target.result;
    try {
      var importedMarks, importedBrackets, importedFilters=[];
      if(file.name.endsWith('.json')){
        // JSON format: {marks: [...], brackets: [...]}
        var parsed = JSON.parse(text);
        if(Array.isArray(parsed.marks) && Array.isArray(parsed.brackets)){
          importedMarks = parsed.marks;
          importedBrackets = parsed.brackets;
          importedFilters = parsed.filters||[];
        } else { throw new Error('Formato JSON inválido'); }
      } else {
        // HTML format — try multiple strategies to extract mdata/bdata
        // Strategy 1: DOMParser
        var parser = new DOMParser();
        var doc = parser.parseFromString(text, 'text/html');
        var mEl = doc.getElementById('mdata');
        var bEl = doc.getElementById('bdata');
        var mText = mEl ? (mEl.textContent||mEl.innerHTML||'').trim() : '';
        var bText = bEl ? (bEl.textContent||bEl.innerHTML||'').trim() : '';
        // Strategy 2: Regex fallback (handles cases where DOMParser strips script content)
        if(!mText || mText==='' || mText==='null'){
          var mMatch = text.match(/id=["']mdata["'][^>]*>([\s\S]*?)<\/script>/i);
          if(mMatch) mText = mMatch[1].trim();
        }
        if(!bText || bText==='' || bText==='null'){
          var bMatch = text.match(/id=["']bdata["'][^>]*>([\s\S]*?)<\/script>/i);
          if(bMatch) bText = bMatch[1].trim();
        }
        if(!mText || !bText) throw new Error('Arquivo HTML não reconhecido como exportação deste site. Certifique-se de usar o botão "↓ HTML" para exportar.');
        importedMarks = JSON.parse(mText);
        importedBrackets = JSON.parse(bText);
        // Filtros (opcional: arquivos exportados antes dos filtros não têm)
        var fEl = doc.getElementById('fdata');
        var fText = fEl ? (fEl.textContent||'').trim() : '';
        if(!fText){
          var fMatch = text.match(/id=["']fdata["'][^>]*>([\s\S]*?)<\/script>/i);
          if(fMatch) fText = fMatch[1].trim();
        }
        try{ importedFilters = fText ? JSON.parse(fText) : []; }catch(fe){ importedFilters = []; }
      }
      // Always create as NEW project (never overwrite current)
      var projectName = file.name.replace(/\.(html|json)$/i,'').replace(/_/g,' ') || 'Importado';
      marks = importedMarks;
      brackets = importedBrackets;
      loadFilters(importedFilters);
      _currentProjectId = null; // force new project
      _currentProjectName = projectName;
      _undoStack = []; _redoStack = [];
      status.textContent = '✓ Importado! ('+marks.length+' datas, '+brackets.length+' chaves)';
      status.style.color = '#166534';
      cf = 0.5;
      if(marks.length>0){
        var si=marks.slice().sort(function(a,b){return a.year-b.year;});
        _lastAddedYear=si[si.length-1].year;
        _scrollToYear=si[0].year;
      }
      cm(); draw(true);
      updateBlankState();
      updateProjectNameDisplay();
      setTimeout(function(){
        closeImport();
        if(_fbUser) fbSave(); // save as new project if logged in
      }, 1200);
    } catch(err){
      status.textContent = 'Erro: ' + err.message;
      status.style.color = '#c0392b';
    }
  };
  reader.readAsText(file);
}


cf=0.5;
renderFilterBar();
updateModeBtn();
draw(false);
updateBlankState();
updateProjectNameDisplay();

</script></body></html>
